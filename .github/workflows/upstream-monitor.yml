name: upstream-monitor

# Watch vendored upstreams for new commits past our pin.
# Spec contract: docs/spec-conversion-policy.md §5.3
#
# Both upstreams went inactive (2025) and the vendor/ subtrees are now
# forward-only forks in place. Inactivity and archival are therefore the
# expected state and open nothing. The only actionable signal is upstream
# resuming: opens an `upstream:new-commits:<upstream>` issue when the
# upstream default-branch HEAD differs from the pinned SHA.
#
# Runs every 2 weeks (1st and 15th at 00:00 UTC) and on manual dispatch.
#
# Upstreams monitored (PLAN.md v0.6 §14):
#   - withfig/autocomplete (M0-9, ISC, TS specs)
#   - aws/amazon-q-developer-cli-autocomplete (M0-1 v0.6, Apache+MIT, Rust+TS engine)

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream_owner: withfig
            upstream_repo: autocomplete
            slug: withfig
            pin_label: M0-9
            pinned_sha: aef52acff84c45edde61ae610cc2c964802b9a38
          - upstream_owner: aws
            upstream_repo: amazon-q-developer-cli-autocomplete
            slug: aws
            pin_label: M0-1 (v0.6)
            pinned_sha: b654a1beb880951dd2343120bb867659622eecd9
    steps:
      - uses: actions/checkout@v4
      - name: Inspect upstream
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_OWNER: ${{ matrix.upstream_owner }}
          UPSTREAM_REPO: ${{ matrix.upstream_repo }}
        run: |
          set -euo pipefail

          repo_json=$(gh api "repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}")
          archived=$(echo "$repo_json" | jq -r '.archived')

          # Last commit date on default branch.
          default_branch=$(echo "$repo_json" | jq -r '.default_branch')
          last_commit=$(gh api \
            "repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits/${default_branch}" \
            | jq -r '.commit.committer.date')
          last_sha=$(gh api \
            "repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits/${default_branch}" \
            | jq -r '.sha')

          # Days since last commit.
          last_epoch=$(date -d "$last_commit" +%s)
          now_epoch=$(date -u +%s)
          age_days=$(( (now_epoch - last_epoch) / 86400 ))

          echo "archived=$archived"   >> "$GITHUB_OUTPUT"
          echo "age_days=$age_days"   >> "$GITHUB_OUTPUT"
          echo "last_commit=$last_commit" >> "$GITHUB_OUTPUT"
          echo "last_sha=$last_sha"   >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream status — ${UPSTREAM_OWNER}/${UPSTREAM_REPO}"
            echo ""
            echo "- archived: \`$archived\`"
            echo "- last commit: \`$last_commit\` (${age_days} days ago)"
            echo "- last SHA: \`$last_sha\`"
            echo "- pinned (${{ matrix.pin_label }}): \`${{ matrix.pinned_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide trigger
        id: decide
        run: |
          last_sha='${{ steps.upstream.outputs.last_sha }}'
          pinned_sha='${{ matrix.pinned_sha }}'
          trigger=false
          reason=""
          if [ "$last_sha" != "$pinned_sha" ]; then
            trigger=true
            reason="upstream HEAD moved past the pinned commit"
          fi
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"
          echo "reason=$reason"   >> "$GITHUB_OUTPUT"

      - name: Open new-commits issue if needed
        if: steps.decide.outputs.trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_OWNER: ${{ matrix.upstream_owner }}
          UPSTREAM_REPO: ${{ matrix.upstream_repo }}
          SLUG: ${{ matrix.slug }}
          PIN_LABEL: ${{ matrix.pin_label }}
          PINNED_SHA: ${{ matrix.pinned_sha }}
        run: |
          set -euo pipefail
          # De-duplicate per upstream: only open if no existing open issue
          # carries this upstream's slug label.
          label="upstream:new-commits:${SLUG}"
          # Seed the label: `gh issue create --label` fails if it is missing.
          # --force makes this idempotent (updates when it already exists).
          gh label create "$label" --force \
            --color 0E8A16 \
            --description "Upstream has commits past our vendor pin (spec-conversion-policy §5.3)"
          existing=$(gh issue list \
            --state open \
            --label "$label" \
            --json number \
            --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "existing ${label} issue is already open — skipping" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh issue create \
            --title "upstream: new commits — ${UPSTREAM_OWNER}/${UPSTREAM_REPO}" \
            --label "$label" \
            --body "$(cat <<EOF
          The upstream \`${UPSTREAM_OWNER}/${UPSTREAM_REPO}\` repository has
          commits past our vendor pin (see \`docs/spec-conversion-policy.md\` §5.3).

          - **Reason**: ${{ steps.decide.outputs.reason }}
          - **Last upstream commit**: ${{ steps.upstream.outputs.last_commit }}
          - **Last upstream SHA**: \`${{ steps.upstream.outputs.last_sha }}\`
          - **Currently pinned (${PIN_LABEL})**: \`${PINNED_SHA}\`

          Action items:
          1. Review the new upstream commits.
          2. Pull what is worth taking with a subtree update PR
             (\`docs/spec-conversion-policy.md\` §5.1), then bump \`pinned_sha\`
             in this workflow. Bumping the pin without pulling also silences it.

          This issue was opened automatically by the \`upstream-monitor\` workflow.
          EOF
          )"
