name: release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0) — must already exist"
        required: true

permissions:
  contents: write # gh release create / upload + read Cargo.toml
  actions: write # gh workflow run homebrew-bump.yml

# Serialize releases per ref: two quick main merges won't race on the
# same version, and a manual tag release never cancels one already
# building.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_CHANNEL: "1.85"

jobs:
  # Decide the tag + whether to cut a release. Cheap ubuntu gate so the
  # expensive macOS build only runs when there's actually something to
  # release.
  gate:
    name: decide release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: decide tag + whether to release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual: release the (already-existing) input tag.
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Direct tag push (v*.*.*): release that tag.
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            # Push to main: the Cargo.toml workspace version drives the
            # tag. Release only when v<version> has no release yet AND the
            # merge commit carries no [skip release] brake. So shipping =
            # "bump Cargo.toml version"; every other merge is a no-op.
            VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            TAG="v${VERSION}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            if git log -1 --format=%B | grep -qF '[skip release]'; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "::notice::[skip release] present — no release for ${TAG}."
            elif gh release view "$TAG" >/dev/null 2>&1; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${TAG} already released — bump Cargo.toml version to ship a new one."
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Releasing ${TAG} from main."
            fi
          fi

  build:
    name: build (${{ matrix.target }})
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only for v0.1 releases. Intel (macos-13)
        # release runners on free-tier are queued long enough
        # (30 min+) that they hold up the release.yml workflow
        # past the point of usefulness. Once there's an Intel
        # user requesting binaries we can either pay for
        # macos-13-large or cross-compile aarch64 → x86_64.
        include:
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_CHANNEL }}
          targets: ${{ matrix.target }}

      - name: install protoc (nerv-proto build.rs)
        # build.rs falls back to a download path that uses `sha256sum`
        # (Linux only). Pre-install protobuf so the system-protoc
        # branch is taken instead.
        run: brew install protobuf

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: build nerv + nervd + nerv-pty
        run: |
          # Ship Tier C (rquickjs) in the release binary: the aws bespoke
          # closures (s3 buckets, ec2 filters, …) only complete when the
          # quickjs feature is compiled in. JS machinery is ~2-3ms (well
          # inside the 25ms budget) and +0.78MB. nerv-pty has no such
          # feature, so scope it per-package. See docs/findings/
          # tier-c-quickjs-e2e.md and PLAN §0.2.
          cargo build --release \
            --target ${{ matrix.target }} \
            -p nerv-cli -p nerv-daemon -p nerv-pty \
            --features nerv-cli/quickjs,nerv-daemon/quickjs

      - name: stage tarball
        id: stage
        run: |
          set -euo pipefail
          # Tag is decided once by the gate job; on a main push
          # GITHUB_REF_NAME is `main`, not a version.
          TAG="${{ needs.gate.outputs.tag }}"
          VERSION="${TAG#v}"
          NAME="nerv-${VERSION}-${{ matrix.target }}"
          STAGE="staging/${NAME}"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/nerv     "$STAGE/"
          cp target/${{ matrix.target }}/release/nervd    "$STAGE/"
          cp target/${{ matrix.target }}/release/nerv-pty "$STAGE/"
          for f in LICENSE NOTICE README.md; do
            [ -f "$f" ] && cp "$f" "$STAGE/"
          done
          tar -czf "${NAME}.tar.gz" -C staging "$NAME"
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          echo "tarball=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${NAME}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          ls -la "${NAME}".*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.tarball }}
          path: |
            ${{ steps.stage.outputs.tarball }}
            ${{ steps.stage.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: gh release create
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: list artifacts
        run: ls -la artifacts

      - name: create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.gate.outputs.tag }}"
          # `gh release create` is idempotent in spirit: create if
          # missing (pointing the new tag at the built commit),
          # otherwise upload --clobber onto the existing release (tag
          # push / dispatch, where the tag already exists).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --notes "Unsigned developer preview build of \`nerv\` + \`nervd\` for macOS (Apple Silicon). Apple Developer ID signing/notarization arrives in a later release — until then, macOS Gatekeeper will warn on first launch. See README for install instructions."
          fi

      - name: bump Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A release created with GITHUB_TOKEN does NOT emit a
          # release:published event that can trigger homebrew-bump —
          # GitHub blocks token-caused workflow cascades to prevent
          # recursion (the same rule that stops our created tag from
          # re-triggering this workflow). Dispatch it explicitly:
          # workflow_dispatch is exempt from that rule, so the tap always
          # tracks the release deterministically instead of via a
          # cascade that silently no-ops.
          gh workflow run homebrew-bump.yml -f tag="${{ needs.gate.outputs.tag }}" \
            || echo "::warning::homebrew-bump dispatch failed — bump the tap manually"
