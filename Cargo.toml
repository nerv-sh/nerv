[workspace]
resolver = "3"
members = [
    "crates/nerv-cli",
    "crates/nerv-daemon",
    "crates/nerv-engine",
    "crates/nerv-shell",
    # Imported from aws/amazon-q-developer-cli-autocomplete (M0-2);
    # nerv-pty is the figterm port (PRD §5.8 — M1 opt-in only at
    # runtime via NERV_PTY=1). Joined workspace after chunk 3d strip
    # of fig_telemetry / fig_auth / fig_install / fig_api_client and
    # deletion of the inline AI completion module (PRD §0.2).
    "crates/nerv-pty",
    "crates/nerv-term",
    "crates/nerv-ipc",
    "crates/nerv-proto",
    "crates/nerv-integrations",
    "crates/nerv-os",
    "crates/nerv-util",
    "crates/nerv-settings",
    "crates/nerv-log",
    "crates/nerv-diag",
    "crates/nerv-test-macro",
    "crates/nerv-test-utils",
    # M1 opt-in Tier C closure executor. Lives behind an opt-in feature
    # in the daemon; not linked by default so the v0.1 binary stays
    # rquickjs-free. PRD §0.2 / CLAUDE.md §4 invariant.
    "crates/nerv-quickjs",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Nerv contributors"]
repository = "https://github.com/nerv-sh/nerv"
homepage = "https://nerv.sh"
readme = "README.md"
publish = false

[workspace.lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
# Imported from aws/amazon-q-developer-cli-autocomplete root Cargo.toml
# so absorbed crates' [lints] workspace = true keeps building. Trimmed
# to a conservative core — full upstream set is recoverable from
# vendor/aws-autocomplete/Cargo.toml if we want stricter checks later.
await_holding_lock = "warn"
dbg_macro = "warn"
needless_borrow = "warn"
needless_continue = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
# CLI
clap = { version = "4.5.32", features = [
    "cargo",
    "deprecated",
    "derive",
    "string",
    "unicode",
    "wrap_help",
] }

# Async / IPC
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["codec", "compat"] }
interprocess = { version = "2.2", features = ["tokio"] }

# Serde
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"

# TUI / ANSI
crossterm = { version = "0.28.1", features = ["event-stream", "events"] }

# Errors / logging
anyhow = "1.0.98"
thiserror = "2.0.12"
tracing = { version = "0.1.40", features = ["log"] }
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "fmt",
    "parking_lot",
    "time",
] }

# Misc (Nerv-original)
once_cell = "1.19.0"
# `directories` (XDG path crate) intentionally not workspace-declared:
# our path constants are docs-driven (uninstall-spec.md §2), so we
# resolve $HOME directly in nerv-engine::paths.

# Internal — Nerv-original
nerv-engine = { path = "crates/nerv-engine" }
nerv-shell = { path = "crates/nerv-shell" }

# Internal — absorbed from aws/amazon-q-developer-cli-autocomplete (M0-2)
nerv-pty = { path = "crates/nerv-pty" }
nerv-term = { path = "crates/nerv-term" }
nerv-ipc = { path = "crates/nerv-ipc" }
nerv-proto = { path = "crates/nerv-proto" }
nerv-integrations = { path = "crates/nerv-integrations" }
nerv-os = { path = "crates/nerv-os" }
nerv-util = { path = "crates/nerv-util" }
nerv-settings = { path = "crates/nerv-settings" }
nerv-log = { path = "crates/nerv-log" }
nerv-diag = { path = "crates/nerv-diag" }
nerv-test-macro = { path = "crates/nerv-test-macro" }
nerv-test-utils = { path = "crates/nerv-test-utils" }

# External — absorbed deps (versions pinned to upstream Cargo.toml)
async-trait = "0.1.87"
base64 = "0.22.1"
bitflags = { version = "2.9.0", features = ["serde"] }
bstr = "1.12.0"
bytes = "1.10.1"
camino = { version = "1.1.3", features = ["serde1"] }
cfg-if = "1.0.0"
dashmap = "6.0.1"
dirs = "5.0.0"
flate2 = "1.1.1"
hex = "0.4.3"
http = "1.2.0"
indoc = "2.0.6"
insta = "1.43.1"
libc = "0.2.172"
mimalloc = "0.1.46"
nix = { version = "0.29.0", features = [
    "feature",
    "fs",
    "ioctl",
    "process",
    "signal",
    "term",
    "user",
] }
parking_lot = "0.12.3"
portable-pty = "0.8.1"
r2d2 = "0.8.10"
r2d2_sqlite = "0.25.0"
rand = "0.9.0"
regex = "1.7.0"
reqwest = { version = "0.12.14", default-features = false, features = [
    "http2",
    "charset",
    "rustls-tls",
    "rustls-tls-native-roots",
    "gzip",
    "json",
    "socks",
    "cookies",
] }
ring = "0.17.14"
rusqlite = { version = "0.32.1", features = ["bundled", "serde_json"] }
semver = { version = "1.0.26", features = ["serde"] }
shell-color = "1.0.0"
shellexpand = "3.0.0"
notify = { version = "7.0", default-features = false, features = ["macos_fsevent"] }
shlex = "1.3.0"
strum = { version = "0.27.1", features = ["derive"] }
sysinfo = "0.33.1"
tempfile = "3.18.0"
time = { version = "0.3.39", features = [
    "parsing",
    "formatting",
    "local-offset",
    "macros",
    "serde",
] }
toml = "0.8.12"
# rquickjs = QuickJS bindings for the M1 Tier C closure executor
# (PRD §0.2 / §5.7 / CLAUDE.md §4 invariant: deno_core 임베드 금지,
# rquickjs ~1MB opt-in only). `loader`+`array-buffer` are needed for
# evaluating module-style sources without surprise side effects;
# `parallel` keeps the runtime Send so a tokio task pool can own it.
rquickjs = { version = "0.6.2", default-features = false, features = [
    "loader",
    "array-buffer",
    "parallel",
] }
unicode-width = "0.2.0"
url = "2.5.4"
uuid = { version = "1.15.1", features = ["v4", "serde"] }
which = "6.0.3"
whoami = "1.6.0"

# dev-only
assert_cmd = "2.0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
