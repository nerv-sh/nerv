[package]
name = "nerv-daemon"
description = "The `nervd` background process — IPC + spec matching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[[bin]]
name = "nervd"
path = "src/main.rs"

[features]
# Forward to nerv-engine's Tier C (rquickjs) closure executor. Off by
# default so the shipped `nervd` stays rquickjs-free; opt in with
# `cargo build -p nerv-daemon --features quickjs`.
quickjs = ["nerv-engine/quickjs"]

[dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nerv-engine = { workspace = true }
# `interprocess` will return for cross-platform UDS/named pipe abstraction
# in M1; v1.0 macOS-only PoC uses tokio::net::UnixListener directly.

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "process"] }
serde_json = { workspace = true }
nerv-engine = { workspace = true }
# SIGTERM in the graceful-shutdown e2e (tokio's Child::kill is SIGKILL).
libc = { workspace = true }
