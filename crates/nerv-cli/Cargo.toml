[package]
name = "nerv-cli"
description = "The `nerv` command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[[bin]]
name = "nerv"
path = "src/main.rs"

[features]
# Forward to nerv-engine's Tier C (rquickjs) closure executor. Off by
# default; opt in with `cargo build -p nerv-cli --features quickjs`.
# Only the `_complete` IPC bridge path exercises it.
quickjs = ["nerv-engine/quickjs"]

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
nerv-engine = { workspace = true }
nerv-shell = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
