[package]
name = "nerv-engine"
description = "Tokenizer, position inference, and prefix-match ranking for Nerv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[features]
# `quickjs` opt-in: links nerv-quickjs and enables the Tier C
# closure executor (Generator::Custom with embedded `source`).
# Default-off so the v0.1 binary stays rquickjs-free.
quickjs = ["dep:nerv-quickjs"]

[dependencies]
# Resolve a command to an absolute path before asking it for `--help`
# (crate::derived) — never a PATH string the shell could reinterpret.
which = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
flate2 = "1.1"
notify = { workspace = true }
toml = { workspace = true }
unicode-width = { workspace = true }
# Async UDS client to nervd (ipc_client) — the daemon wire protocol's
# single source of truth, shared by the CLI bridge and the PTY shim.
tokio = { workspace = true }
# Optional Tier C executor — only compiled when --features quickjs.
nerv-quickjs = { path = "../nerv-quickjs", optional = true }

[[bin]]
name = "build-specs"
path = "src/bin/build_specs.rs"

[dev-dependencies]
tempfile.workspace = true
