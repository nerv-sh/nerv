[package]
name = "nerv-spec-transpile"
description = "Build tool — transpile withfig/autocomplete TS specs to static JSON"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish = false

[[bin]]
name = "nerv-spec-build"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nerv-engine = { workspace = true }

# swc_core is intentionally NOT pinned here yet — the M0-2 spike picks
# the exact subset (`ecma_parser` + `ecma_visit`) and version. Adding
# 100+ MB of dependencies before that decision is wasteful.
# swc_core = { version = "0.96", features = ["ecma_parser", "ecma_ast", "ecma_visit"] }
